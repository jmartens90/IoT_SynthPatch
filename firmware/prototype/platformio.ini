; Prototype on a bare ESP32-S3 dev kit while the PCB parts are delayed.
; Same LFO/envelope engine and pitch tracker as the real module (../synthpatch/lib/engine),
; with breadboard parts: MCP4725 + AD5693R I2C DACs, SHT45 / DS18B20 / internal temperature,
; a GPIO frequency counter instead of the PCM1808, and a web GUI + MQTT.
;
; Build/flash:  pio run -t upload
; Serial shell: pio device monitor      (type: help)
; Wiring:       WIRING.md

[env:prototype]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Test kit: ESP32-S3 N16R8 (16 MB flash, 8 MB OCTAL PSRAM, which uses GPIO 35-37 internally:
; don't wire those). The PCB gets an N16R2 (2 MB quad PSRAM, GPIO 35-37 free). PSRAM is not used.
; Own flash layout: 2x 4 MB firmware + ~7.9 MB LittleFS for the measurement log.
; (On an 8 MB kit: use default_8MB.csv and set DataLog::CAPACITY lower.)
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The shared engine library lives next to this project.
lib_extra_dirs = ../synthpatch/lib

; The engine is C++17 (std::clamp, structured bindings); Arduino defaults to gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; No -DBOARD_HAS_PSRAM: nothing uses PSRAM, and qio_qspi can't talk to the R8's octal PSRAM
    ; ("PSRAM ID read error"). The firmware runs fine in the 512 kB internal RAM.
    ; Serial = the UART port (marked COM/UART on most S3 dev kits, the one you flash through).
    ; Set ARDUINO_USB_CDC_ON_BOOT=1 instead to use the port marked USB (native USB).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    links2004/WebSockets@^2.6.1
    knolleary/PubSubClient@^2.8
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
