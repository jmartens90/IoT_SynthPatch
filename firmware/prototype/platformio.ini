; Prototype on a bare ESP32-S3 dev kit while the PCB parts are delayed.
; Same LFO/envelope engine and pitch tracker as the real module (../synthpatch/lib/engine),
; with breadboard parts: MCP4725 + AD5693R I2C DACs, SHT45 / DS18B20 / internal temperature,
; a GPIO frequency counter instead of the PCM1808, and a web GUI + MQTT.
;
; Build/flash:  pio run -t upload
; Serial shell: pio device monitor      (type: help)
; Wiring:       WIRING.md

[env:prototype]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Works on any S3 DevKitC: no PSRAM assumed, 8 MB flash layout.
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The shared engine library lives next to this project.
lib_extra_dirs = ../synthpatch/lib

; The engine is C++17 (std::clamp, structured bindings); Arduino defaults to gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
