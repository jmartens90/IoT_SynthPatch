; IoT_SYNTHPATCH bring-up firmware
; ESP32-S3-WROOM-1-N16R2: 16 MB QIO flash, 2 MB quad PSRAM, native USB on IO19/IO20.
;
; Build:  pio run
; Flash:  pio run -t upload        (first time: BOOT switch SW2 on, toggle EN switch SW1)
; Serial: pio device monitor

[env:bringup]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit BusIO@^1.16.1

; Breadboard prototype on a plain ESP32-S3 dev kit (before the PCBs arrive).
; No PSRAM assumed and the default 8 MB flash layout, so it boots on any S3 DevKitC variant.
; Build/flash with:  pio run -e devkit -t upload
[env:devkit]
extends = env:bringup
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
